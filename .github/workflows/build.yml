name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FartTrigger-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish APK as a download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/*.apk FartTrigger.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest FartTrigger.apk --title "Fart Trigger (latest build)" --notes "Tap FartTrigger.apk below to download, then open it to install."
